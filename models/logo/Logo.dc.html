<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05070A}
a{color:#F3C878}a:hover{color:#FFD995}

/* ===== marca GM (4 capas: haz, cara izquierda, cara derecha, G) ===== */
.mk{position:relative;aspect-ratio:240/280;flex-shrink:0}
.mk svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transition:transform .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 2px var(--c)) drop-shadow(0 0 12px var(--g))}
.mk .face{fill:var(--f);stroke:var(--c);stroke-width:1.8;stroke-linejoin:miter;stroke-miterlimit:8}
.mk .cmt{fill:none;stroke:#FFFFFF;stroke-width:2.4;stroke-linecap:round;opacity:.9}
.mk .cg{stroke-dasharray:24 490.7;animation:run-g 4.5s linear infinite}
.mk .cm{stroke-dasharray:28 544;animation:run-m 4.5s linear infinite}
.mk .l-mr .cm{animation-delay:-2.25s}
.mk .beam{stroke:var(--c);stroke-width:2;stroke-linecap:round;animation:flick 3.2s ease-in-out infinite}
.mk .drop{fill:none;stroke:#FFFFFF;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:18 140;stroke-dashoffset:18;animation:drop 2.8s cubic-bezier(.5,0,.8,1) 1.8s infinite}
.mk.anim{animation:float 6s ease-in-out infinite}
.mk.anim .face{stroke-dasharray:580;animation:trace 1.8s cubic-bezier(.6,0,.2,1) both,fillin 1s 1.1s ease both}
.mk.anim .l-ml .face{animation-delay:.15s,1.25s}
.mk.anim .l-mr .face{animation-delay:.3s,1.4s}
.mk:hover .l-g{transform:translateY(-12px)}
.mk:hover .l-ml{transform:translate(-9px,5px)}
.mk:hover .l-mr{transform:translate(9px,5px)}
.mk:hover .l-b{transform:translateY(-18px)}
.mk.static .cmt,.mk.static .drop{display:none}
.mk.static .beam{animation:none}
@keyframes run-g{to{stroke-dashoffset:-514.7}}
@keyframes run-m{to{stroke-dashoffset:-572}}
@keyframes drop{0%{stroke-dashoffset:18}70%,100%{stroke-dashoffset:-122}}
@keyframes trace{from{stroke-dashoffset:580}to{stroke-dashoffset:0}}
@keyframes fillin{from{fill-opacity:0}to{fill-opacity:1}}
@keyframes flick{0%,100%{opacity:1}44%{opacity:.3}48%{opacity:1}53%{opacity:.5}58%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes cyc{0%,100%{color:#F3C878}33%{color:#FF6A3D}66%{color:#4FE0B6}}

/* tricolor: G = LoL (oro), cara izquierda = ARC (naranja), cara derecha = Zelda (verde) */
.v-tri .l-g{--c:#F3C878;--g:rgba(243,200,120,.55);--f:#231B0E}
.v-tri .l-ml{--c:#FF6A3D;--g:rgba(255,106,61,.55);--f:#25110A}
.v-tri .l-mr{--c:#4FE0B6;--g:rgba(79,224,182,.5);--f:#08221C}
.v-tri .l-b{--c:#F3C878;--g:rgba(243,200,120,.6)}
/* original verde */
.v-grn svg{--c:#6BFF4A;--g:rgba(80,255,60,.55)}
.v-grn .l-g{--f:#15301B}
.v-grn .l-ml{--f:#10261A}
.v-grn .l-mr{--f:#0A1A10}
/* ciclo de color */
.v-cyc svg{--f:#11141B;animation:cyc 6s linear infinite;filter:drop-shadow(0 0 2px currentColor) drop-shadow(0 0 12px currentColor)}
.v-cyc .face,.v-cyc .beam{stroke:currentColor}
.v-cyc .l-ml{animation-delay:-2s}
.v-cyc .l-mr{animation-delay:-4s}
/* monocromo */
.v-mono svg{--c:#ECE9E1;--f:#12151B;filter:none}
.v-light svg{--c:#0B0E14;--f:#FFFFFF;filter:none}

/* ===== layout ===== */
.root{width:1200px;height:760px;display:flex;background:#05070A;color:#ECE9E1;font-family:'IBM Plex Sans',system-ui,sans-serif;overflow:hidden}
.stage{position:relative;width:640px;height:760px;display:grid;place-items:center;isolation:isolate;border-right:1px solid rgba(255,255,255,.07)}
.stage::before{content:"";position:absolute;inset:0;z-index:-2;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:26px 26px;-webkit-mask-image:radial-gradient(circle at 50% 48%,#000 10%,transparent 62%);mask-image:radial-gradient(circle at 50% 48%,#000 10%,transparent 62%)}
.halo{position:absolute;z-index:-1;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,rgba(243,200,120,.16),rgba(255,106,61,.08) 40%,rgba(79,224,182,.06) 60%,transparent 70%);animation:breathe 5s ease-in-out infinite}
.ring{position:absolute;z-index:-1;width:400px;height:400px;border-radius:50%;border:1px dashed rgba(255,255,255,.1);animation:spin 40s linear infinite}
.floor{position:absolute;bottom:110px;width:260px;height:26px;border-radius:50%;background:radial-gradient(ellipse,rgba(243,200,120,.28),transparent 70%);filter:blur(6px);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
.side{flex:1;padding:44px 40px;display:flex;flex-direction:column;gap:26px}
.lockup{display:flex;align-items:center;gap:16px}
.word{font-family:'Chakra Petch',system-ui,sans-serif;font-weight:700;font-size:34px;letter-spacing:.06em;line-height:1}
.word span{color:#F3C878}
.label{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8F98A5}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 12px 14px;border-radius:16px;background:#0B0E14;border:1px solid rgba(255,255,255,.07)}
.tile.light{background:#F3F1EA}
.tile.light .label{color:#5A6170}
.sizes{display:flex;align-items:flex-end;gap:14px}
.fav{display:grid;place-items:center;background:#0B0E14;border:1px solid rgba(255,255,255,.08)}
.fav.f64{width:64px;height:64px;border-radius:16px}
.fav.f40{width:40px;height:40px;border-radius:10px}
.fav.f28{width:28px;height:28px;border-radius:7px}
</style>
</helmet>
