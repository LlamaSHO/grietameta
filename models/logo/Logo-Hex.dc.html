<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Propuesta C, G hexagonal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05070A}
a{color:#F3C878}a:hover{color:#FFD995}
.root{position:relative;width:620px;height:760px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:60px;background:#05070A;color:#ECE9E1;font-family:'IBM Plex Sans',system-ui,sans-serif;overflow:hidden;isolation:isolate}
.root::before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.2px);background-size:24px 24px;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 5%,transparent 55%);mask-image:radial-gradient(circle at 50% 40%,#000 5%,transparent 55%)}
.mark{position:relative;width:280px;height:280px}
.mark svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.seg{fill:none;stroke-width:26;stroke-linejoin:miter;stroke-miterlimit:6;stroke-linecap:butt;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.s1{stroke:#F3C878;stroke-dasharray:130;animation:d1 1s cubic-bezier(.6,0,.2,1) both,b1 5s 1.8s ease-in-out infinite}
.s2{stroke:#FF6A3D;stroke-dasharray:80;animation:d2 .7s .55s cubic-bezier(.6,0,.2,1) both,b2 5s 1.8s ease-in-out infinite}
.s3{stroke:#4FE0B6;stroke-dasharray:196;animation:d3 1.1s .9s cubic-bezier(.6,0,.2,1) both,b3 5s 1.8s ease-in-out infinite}
@keyframes d1{from{stroke-dashoffset:130}to{stroke-dashoffset:0}}
@keyframes d2{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}
@keyframes d3{from{stroke-dashoffset:196}to{stroke-dashoffset:0}}
@keyframes b1{0%,100%{transform:none;filter:none}15%{transform:translate(-3px,-5px);filter:drop-shadow(0 0 10px rgba(243,200,120,.8))}30%{transform:none;filter:none}}
@keyframes b2{0%,30%,100%{transform:none;filter:none}45%{transform:translate(-6px,0);filter:drop-shadow(0 0 10px rgba(255,106,61,.8))}60%{transform:none;filter:none}}
@keyframes b3{0%,60%,100%{transform:none;filter:none}75%{transform:translate(4px,4px);filter:drop-shadow(0 0 10px rgba(79,224,182,.8))}90%{transform:none;filter:none}}
.mark:hover .s1{animation:none;transform:translate(-7px,-10px)}
.mark:hover .s2{animation:none;transform:translate(-12px,0)}
.mark:hover .s3{animation:none;transform:translate(8px,8px)}
.shadow{position:absolute;left:50%;bottom:-24px;width:200px;height:20px;margin-left:-100px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.12),transparent 70%)}
.lockup{display:flex;align-items:center;gap:14px}
.word{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;letter-spacing:-.035em;line-height:1}
.word span{color:#7C8592}
.mini{width:46px;height:46px;border-radius:12px;background:#0E1219;border:1px solid rgba(255,255,255,.08);display:grid;place-items:center}
.mini svg{width:34px;height:34px}
.mini .seg{animation:none;stroke-dasharray:none}
</style>
</helmet>

<div class="root">
  <div class="mark" role="img" aria-label="Logo G hexagonal en tres colores">
    <div class="shadow" aria-hidden="true"></div>
    <svg viewBox="0 0 240 240" aria-hidden="true">
      <path class="seg s1" d="M154.3 67.8 L120 48 L57.6 84 L57.6 100"></path>
      <path class="seg s2" d="M57.6 110 L57.6 156 L85.7 172.2"></path>
      <path class="seg s3" d="M91.9 175.8 L120 192 L182.4 156 L182.4 124 L126 124"></path>
    </svg>
  </div>

  <div class="lockup">
    <div class="mini" aria-hidden="true">
      <svg viewBox="30 20 180 200">
        <path class="seg s1" d="M154.3 67.8 L120 48 L57.6 84 L57.6 100"></path>
        <path class="seg s2" d="M57.6 110 L57.6 156 L85.7 172.2"></path>
        <path class="seg s3" d="M91.9 175.8 L120 192 L182.4 156 L182.4 124 L126 124"></path>
      </svg>
    </div>
    <div class="word">grieta<span>meta</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":620,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
