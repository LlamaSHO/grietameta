name: Actualizar estadísticas de Riot

# Se ejecuta cada 6 horas y también se puede lanzar a mano desde la pestaña
# "Actions" de GitHub ("Run workflow"). Cada ejecución analiza partidas durante
# hasta 5 horas (RUN_BUDGET_MINUTES) y luego publica el resultado.
# Para volver a una sola ejecución nocturna, deja solo esta línea en "cron":
#   - cron: "17 3 * * *"
on:
  schedule:
    - cron: "17 3,9,15,21 * * *" # 03:17, 09:17, 15:17 y 21:17 UTC
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Minutos máximos analizando partidas (300 = normal; 15 = prueba rápida para ver cambios)"
        required: false
        default: "300"

permissions:
  contents: write

# Solo una ejecución a la vez. Dos ejecuciones simultáneas se repartirían el
# mismo límite de peticiones de Riot y se pisarían al guardar los datos.
# Si llega otra mientras corre una, espera su turno (no cancela la actual).
concurrency:
  group: riot-stats
  cancel-in-progress: false

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # el máximo de GitHub son 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sin topes de jugadores ni de partidas: el script analiza hasta agotar
      # el presupuesto de tiempo, siempre dentro del límite de peticiones de Riot.
      - name: Descargar y calcular estadísticas reales
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RUN_BUDGET_MINUTES: ${{ inputs.budget_minutes || '300' }}
        run: node scripts/fetch-riot-stats.mjs

      # Copia de seguridad: si algo fallase al publicar, el trabajo de horas
      # no se pierde; se puede descargar desde la página de la ejecución.
      - name: Guardar copia de seguridad de los datos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stats-backup
          path: |
            champion-stats.json
            data/raw-stats.json.gz
          if-no-files-found: ignore
          retention-days: 14

      # Los dos archivos generados SIEMPRE ganan: se parte de la última versión
      # del repositorio (por si has subido cambios mientras corría) y se
      # sobrescriben solo estos dos archivos. Así no puede haber conflictos.
      - name: Publicar en el repositorio
        run: |
          git config user.name "LlamaSHO"
          git config user.email "241094598+LlamaSHO@users.noreply.github.com"
          mkdir -p /tmp/stats-out/data
          cp champion-stats.json /tmp/stats-out/champion-stats.json
          cp data/raw-stats.json.gz /tmp/stats-out/data/raw-stats.json.gz
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/stats-out/champion-stats.json champion-stats.json
            cp /tmp/stats-out/data/raw-stats.json.gz data/raw-stats.json.gz
            git rm --ignore-unmatch --quiet riot-stats-state.json
            git add champion-stats.json data/raw-stats.json.gz
            if git diff --cached --quiet; then
              echo "Sin cambios, nada que publicar."
              exit 0
            fi
            git commit -m "chore: actualizar estadisticas de Riot"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "El push falló (intento $intento de 5); reintentando…"
            sleep $((intento * 5))
          done
          echo "No se pudo publicar tras 5 intentos."
          exit 1
