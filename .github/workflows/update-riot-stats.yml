name: Actualizar estadísticas de Riot

# Se ejecuta cada noche y también se puede lanzar a mano desde la pestaña
# "Actions" de GitHub ("Run workflow"), por si quieres forzar una actualización.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC todos los días (fuera de hora punta en EUW)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    # Con el volumen "máximo" (~4.800 partidas/ejecución) esto puede tardar
    # 3-4 horas. El límite por defecto de GitHub Actions es 360 min (6h),
    # así que sobra margen, pero lo dejamos explícito para que quede claro.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar y calcular estadísticas reales
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          # Volumen "máximo": 8 rangos × 150 jugadores × 4 partidas = hasta
          # 4.800 partidas nuevas por ejecución (antes: 1.200).
          SUMMONERS_PER_BUCKET: "150"
          MATCHES_PER_SUMMONER: "4"
          MAX_MATCHES: "4800"
        run: node scripts/fetch-riot-stats.mjs

      - name: Hacer commit si hay cambios
        run: |
          git config user.name "LlamaSHO"
          git config user.email "241094598+LlamaSHO@users.noreply.github.com"
          git rm --ignore-unmatch --quiet riot-stats-state.json
          git add champion-stats.json data/raw-stats.json.gz
          git diff --cached --quiet && echo "Sin cambios, nada que commitear." || (git commit -m "chore: actualizar estadisticas de Riot" && git pull --rebase origin main && git push)
