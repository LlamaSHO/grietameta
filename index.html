<style>
/* Pantalla de carga inicial (la quita src/services/splash.js) */
#gm-splash{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:radial-gradient(600px 420px at 50% 45%,rgba(217,181,110,.10),transparent 70%),#07090D;transition:opacity .45s ease;pointer-events:auto;cursor:progress}
#gm-splash.out{opacity:0;pointer-events:auto}
#gm-splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:18px}
#gm-splash svg{width:84px;height:98px;overflow:visible}
#gm-splash polygon{opacity:0;animation:gmIn .55s cubic-bezier(.2,.8,.2,1) forwards}
#gm-splash .l{fill:#F28A1E;transform:translate(-14px,10px);animation-delay:.05s}
#gm-splash .r{fill:#2FC4B2;transform:translate(14px,10px);animation-delay:.2s}
#gm-splash .g{fill:#E3B862;transform:translateY(-16px);animation-delay:.35s}
#gm-splash b{font:700 18px/1 'Chakra Petch','Segoe UI',sans-serif;letter-spacing:.12em;color:#F2EBDD;opacity:0;animation:gmFade .5s ease .5s forwards}
#gm-splash b span{color:#E3B862}
#gm-splash i{display:block;width:140px;height:2px;border-radius:2px;background:rgba(242,235,221,.1);overflow:hidden}
#gm-splash i::after{content:"";display:block;width:40%;height:100%;background:linear-gradient(90deg,#F28A1E,#E3B862,#2FC4B2);animation:gmBar 1.1s ease-in-out infinite}
@keyframes gmIn{to{opacity:1;transform:none}}
@keyframes gmFade{to{opacity:1}}
@keyframes gmBar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#gm-splash{transition:none}#gm-splash *,#gm-splash i::after{animation:none!important;opacity:1!important;transform:none!important}}
</style>
